<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Temple"><meta name="apple-mobile-web-app-status-bar-style" content="black"></head><body><script>/* Temple · copia del iPhone: conecta la app con tu cuenta en Supabase.
   Imita la base de datos que usa la app (doc/collection) para no tocar el resto del código. */
(function(){
var URL_='https://tkuiwssnwljjxgcixhtr.supabase.co',KEY='sb_publishable_OGOh4KwojGkr4r2zUI6pGQ_hgSfFFgo',SK='temple.auth.v1';
var ses=null;try{ses=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){}
function keep(){try{if(ses)localStorage.setItem(SK,JSON.stringify(ses));else localStorage.removeItem(SK)}catch(e){}}
function mkErr(code,msg){var e=new Error(msg||code);e.code=code;return e}
function setSes(r){var now=Math.floor(Date.now()/1000);ses={at:r.access_token,rt:r.refresh_token,exp:r.expires_at||(now+(r.expires_in||3600)),uid:r.user&&r.user.id,email:r.user&&r.user.email};keep()}
async function authCall(path,body){
  var res=await fetch(URL_+'/auth/v1/'+path,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  var j=null;try{j=await res.json()}catch(e){}
  if(!res.ok)throw mkErr(res.status===400||res.status===422||res.status===401?'auth':'http',(j&&(j.msg||j.error_description||j.message))||('HTTP '+res.status));
  return j}
var refreshing=null;
async function fresh(){
  if(!ses)throw mkErr('nosession');
  if(ses.exp-60>Math.floor(Date.now()/1000))return ses.at;
  if(!refreshing)refreshing=authCall('token?grant_type=refresh_token',{refresh_token:ses.rt}).then(function(r){setSes(r);return ses.at}).catch(function(e){if(e.code==='auth'){ses=null;keep();ui()}throw e}).then(function(v){refreshing=null;return v},function(e){refreshing=null;throw e});
  return refreshing}
async function rest(method,qs,body,extra){
  var tok=await fresh();
  var res=await fetch(URL_+'/rest/v1/docs'+qs,{method:method,headers:Object.assign({'apikey':KEY,'Authorization':'Bearer '+tok,'Content-Type':'application/json'},extra||{}),body:body?JSON.stringify(body):undefined});
  if(res.status===401){ses&&(ses.exp=0);tok=await fresh();res=await fetch(URL_+'/rest/v1/docs'+qs,{method:method,headers:Object.assign({'apikey':KEY,'Authorization':'Bearer '+tok,'Content-Type':'application/json'},extra||{}),body:body?JSON.stringify(body):undefined})}
  if(!res.ok)throw mkErr('http','HTTP '+res.status);
  var t=await res.text();return t?JSON.parse(t):null}
/* ruta de la app 'data/users/<id>/app/sessions/x' -> 'app/sessions/x' en la tabla */
function rel(p){var m=p.match(/^data\/users\/[^/]+\/(.*)$/);return m?m[1]:p}
var db={
  doc:function(p){var r=rel(p);return{
    get:async function(){var a=await rest('GET','?path=eq.'+encodeURIComponent(r)+'&select=data');var x=a&&a[0];return{exists:!!x,data:function(){return x?x.data:undefined}}},
    set:async function(v){await rest('POST','?on_conflict=user_id,path',{user_id:ses.uid,path:r,data:v,updated_at:new Date().toISOString()},{'Prefer':'resolution=merge-duplicates,return=minimal'})},
    delete:async function(){await rest('DELETE','?path=eq.'+encodeURIComponent(r))}}},
  collection:function(p){var r=rel(p);return{
    limit:function(){return this},
    get:async function(){var a=await rest('GET','?path=like.'+encodeURIComponent(r+'/*')+'&select=path,data&limit=1000');
      var docs=(a||[]).filter(function(x){return x.path.split('/').length===r.split('/').length+1}).map(function(x){return{id:x.path.split('/').pop(),data:function(){return x.data}}});return{docs:docs}},
    onSnapshot:function(){return function(){}}}}
};
var user={id:async function(){return ses&&ses.uid||null},isOwner:async function(){return false},profiles:async function(){return{}}};
window.claude={use:async function(n){if(n==='db')return ses?db:null;if(n==='user')return user;return null}};
/* ---- pantalla de cuenta ---- */
var mode='in',busy=false,msg='';
function el(id){return document.getElementById(id)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ui(){bar();if(window.render&&window.U&&U.tab==='settings')try{render()}catch(e){}}
function bar(){var b=el('acctbar');if(!b){b=document.createElement('div');b.id='acctbar';b.style.cssText='display:none;padding:9px 16px;font:600 12px/1.35 inherit;background:var(--surface-2,#222);color:var(--ink,#fff);cursor:pointer;text-align:center';b.onclick=function(){TA.open()};var s=el('sync');s&&s.parentNode?s.parentNode.insertBefore(b,s):document.body.insertBefore(b,document.body.firstChild)}
  b.style.display=ses?'none':'block';b.textContent='Toca aquí para iniciar sesión y guardar tus datos en tu cuenta'}
function modal(){
  var m=el('acctmodal');if(!m){m=document.createElement('div');m.id='acctmodal';m.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px';document.body.appendChild(m)}
  var up=mode==='up';
  m.innerHTML='<div style="background:var(--surface,#161616);color:var(--ink,#f2f2ee);border:1px solid var(--line,#333);border-radius:16px;padding:20px;width:100%;max-width:360px;font-family:inherit"><div style="font-weight:800;font-size:20px;margin-bottom:4px">'+(up?'Crear cuenta':'Entrar a tu cuenta')+'</div><p style="margin:0 0 14px;font-size:13px;opacity:.75">Tus entrenamientos se guardan en tu cuenta y se sincronizan entre tus dispositivos.'+(up?' Crear cuenta solo funciona con el correo con el que te invitaron.':'')+'</p><input id="ac_e" type="email" autocomplete="username" inputmode="email" autocapitalize="off" placeholder="Correo" style="width:100%;box-sizing:border-box;margin-bottom:8px"><input id="ac_p" type="password" autocomplete="'+(up?'new-password':'current-password')+'" placeholder="Contraseña (mínimo 6)" style="width:100%;box-sizing:border-box"><div id="ac_m" style="min-height:18px;margin:8px 0;font-size:13px;color:var(--warn,#ffb020)">'+esc(msg)+'</div><button id="ac_go" class="btn primary" style="width:100%">'+(busy?'Un momento…':(up?'Crear cuenta':'Entrar'))+'</button><div style="display:flex;justify-content:space-between;margin-top:12px;font-size:13px"><a href="#" id="ac_sw" style="color:inherit">'+(up?'Ya tengo cuenta':'Crear cuenta nueva')+'</a><a href="#" id="ac_x" style="color:inherit;opacity:.7">Cerrar</a></div></div>';
  m.style.display='flex';
  el('ac_go').onclick=go;el('ac_x').onclick=function(e){e.preventDefault();TA.close()};el('ac_sw').onclick=function(e){e.preventDefault();mode=up?'in':'up';msg='';modal()};
  el('ac_p').onkeydown=function(e){if(e.key==='Enter')go()}}
async function go(){
  if(busy)return;var e=el('ac_e').value.trim(),p=el('ac_p').value;
  if(!e||!p){msg='Escribe tu correo y tu contraseña';return modal2(e)}
  if(p.length<6){msg='La contraseña debe tener al menos 6 caracteres';return modal2(e)}
  if(navigator.onLine===false){msg='Necesitas internet para iniciar sesión la primera vez';return modal2(e)}
  busy=true;msg='';modal2(e,true);
  try{
    var r=mode==='up'?await authCall('signup',{email:e,password:p}):await authCall('token?grant_type=password',{email:e,password:p});
    if(!r.access_token)throw mkErr('auth','Revisa tu correo para confirmar la cuenta');
    setSes(r);busy=false;TA.close();ui();chkAdmin();try{window.dispatchEvent(new Event('online'))}catch(x){}
    try{window.toast&&window.toast('Sesión iniciada')}catch(x){}
  }catch(x){busy=false;var t=x.message||'';
    msg=(mode==='up'&&/Database error|invitaci|not allowed/i.test(t))?'Ese correo no está invitado. Pídele a quien te compartió la app que lo agregue.':/Invalid login/i.test(t)?'Correo o contraseña incorrectos':/already registered|already been registered/i.test(t)?'Ese correo ya tiene cuenta. Toca "Ya tengo cuenta"':/valid email|invalid format/i.test(t)?'Ese correo no es válido':x.code==='http'||/fetch|network/i.test(t)?'No se pudo conectar. Revisa tu internet':t;
    modal2(e)}}
function modal2(e,keepPass){var pv=keepPass?el('ac_p').value:'';modal();el('ac_e').value=e||'';if(pv)el('ac_p').value=pv}
/* ---- administrador: invitar amigos (solo si tu usuario esta en la tabla admins) ---- */
var adm=false,invList=[],invMsg='',invBusy=false;
async function rt(method,path,body,extra){
  var tok=await fresh();
  var res=await fetch(URL_+'/rest/v1/'+path,{method:method,headers:Object.assign({'apikey':KEY,'Authorization':'Bearer '+tok,'Content-Type':'application/json'},extra||{}),body:body?JSON.stringify(body):undefined});
  if(!res.ok){var j=null;try{j=await res.json()}catch(e){}var er=mkErr(res.status===409?'dup':'http',(j&&(j.message||j.msg))||('HTTP '+res.status));throw er}
  var t=await res.text();return t?JSON.parse(t):null}
async function chkAdmin(){try{if(!ses||navigator.onLine===false)return;var a=await rt('GET','admins?select=user_id');var v=!!(a&&a.length);if(v!==adm){adm=v;ui()}}catch(e){}}
function invText(email){return 'Hola, te invité a Temple, mi app de entrenamiento. Ya te autoricé con este correo: '+email+'. Abre la app que te voy a compartir, toca "Crear cuenta" y usa ese mismo correo con la contraseña que quieras.'}
function invDraw(){
  var m=el('acctmodal');if(!m)return;
  var rows=invList.map(function(r,i){return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line,#333);font-size:13px"><div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">'+esc(r.email)+(r.note?'<br><span style="opacity:.6">'+esc(r.note)+'</span>':'')+'</div><button class="btn sm" data-sh="'+i+'">Compartir</button><button class="btn sm ghost" data-rm="'+i+'" aria-label="Quitar">Quitar</button></div>'}).join('');
  m.innerHTML='<div style="background:var(--surface,#161616);color:var(--ink,#f2f2ee);border:1px solid var(--line,#333);border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:86vh;overflow:auto;font-family:inherit"><div style="font-weight:800;font-size:20px;margin-bottom:4px">Invitar amigos</div><p style="margin:0 0 12px;font-size:13px;opacity:.75">Solo los correos de esta lista pueden crear cuenta. Agrega uno y compárteles la invitación.</p><input id="iv_e" type="email" inputmode="email" autocapitalize="off" placeholder="Correo de tu amigo" style="width:100%;box-sizing:border-box;margin-bottom:8px"><input id="iv_n" type="text" placeholder="Nombre (opcional)" style="width:100%;box-sizing:border-box"><div id="iv_m" style="min-height:18px;margin:8px 0;font-size:13px;color:var(--warn,#ffb020)">'+esc(invMsg)+'</div><button id="iv_go" class="btn primary" style="width:100%">'+(invBusy?'Un momento…':'Agregar a la lista')+'</button><div style="margin-top:14px;font-size:12px;opacity:.7">En la lista ('+invList.length+')</div>'+rows+'<div style="text-align:right;margin-top:12px"><a href="#" id="iv_x" style="color:inherit;opacity:.7;font-size:13px">Cerrar</a></div></div>';
  m.style.display='flex';
  el('iv_go').onclick=invAdd;el('iv_x').onclick=function(e){e.preventDefault();TA.close()};
  Array.prototype.forEach.call(m.querySelectorAll('[data-sh]'),function(b){b.onclick=function(){invShare(invList[+b.getAttribute('data-sh')].email)}});
  Array.prototype.forEach.call(m.querySelectorAll('[data-rm]'),function(b){b.onclick=function(){invDel(invList[+b.getAttribute('data-rm')].email)}})}
async function invLoad(){try{invList=(await rt('GET','allowed_emails?select=email,note,created_at&order=created_at.desc'))||[]}catch(e){invMsg='No se pudo cargar la lista. Revisa tu internet'}}
async function invOpen(){
  if(navigator.onLine===false){try{window.toast&&window.toast('Necesitas internet para invitar')}catch(x){}return}
  invMsg='';invBusy=true;invDraw();await invLoad();invBusy=false;invDraw()}
async function invAdd(){
  if(invBusy)return;var e=(el('iv_e').value||'').trim().toLowerCase(),n=(el('iv_n').value||'').trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){invMsg='Ese correo no es válido';return invDraw()}
  if(navigator.onLine===false){invMsg='Necesitas internet para agregar';return invDraw()}
  invBusy=true;invMsg='';invDraw();
  try{await rt('POST','allowed_emails',{email:e,note:n||null},{'Prefer':'return=minimal'});invMsg='Listo. Toca Compartir en '+e+' para mandarle la invitación'}
  catch(x){invMsg=x.code==='dup'?'Ese correo ya está en la lista':'No se pudo agregar. Intenta de nuevo'}
  await invLoad();invBusy=false;invDraw()}
async function invDel(email){
  if(!confirm('¿Quitar '+email+' de la lista? Si ya creó su cuenta, la cuenta sigue funcionando.'))return;
  try{await rt('DELETE','allowed_emails?email=eq.'+encodeURIComponent(email));invMsg='Quitado: '+email}catch(x){invMsg='No se pudo quitar'}
  await invLoad();invDraw()}
async function invShare(email){
  var t=invText(email);
  try{if(navigator.share){await navigator.share({text:t});return}}catch(x){if(x&&x.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);invMsg='Texto copiado. Pégalo en tu chat con '+email}catch(x){invMsg='No se pudo copiar el texto'}
  invDraw()}window.TA={
  invOpen:invOpen,signedIn:function(){return !!ses},email:function(){return ses&&ses.email||''},
  open:function(m){mode=m||'in';msg='';busy=false;modal()},
  close:function(){var m=el('acctmodal');if(m)m.style.display='none'},
  out:function(){if(!confirm('¿Cerrar sesión? Tus datos se quedan en este teléfono y en tu cuenta.'))return;ses=null;keep();ui()},
  card:function(){return ses?'<div class="sec"><h3>Tu cuenta</h3><p class="small muted">Conectado como <b>'+esc(ses.email||'')+'</b>. Tus entrenamientos se guardan en la nube y se sincronizan solos cuando hay internet.</p><button class="btn sm ghost" onclick="TA.out()">Cerrar sesión</button></div>'+(adm?'<div class="sec"><h3>Invitar amigos</h3><p class="small muted">Solo los correos de tu lista pueden crear cuenta en Temple.</p><button class="btn sm primary" onclick="TA.invOpen()">Invitar amigos</button></div>':''):'<div class="sec"><h3>Tu cuenta</h3><p class="small muted">Inicia sesión para guardar tus datos en la nube y verlos también en tu computadora. Sin cuenta, todo se queda solo en este teléfono.</p><div class="row wrap"><button class="btn sm primary" onclick="TA.open(\'in\')">Iniciar sesión</button><button class="btn sm" onclick="TA.open(\'up\')">Crear cuenta</button></div></div>'}
};
document.addEventListener('DOMContentLoaded',bar);window.addEventListener('online',chkAdmin);setTimeout(chkAdmin,2000);
})();

  --accent:#0b0b0c;--on-accent:#ffffff;--accent-text:#0b0b0c;--brand:#0b0b0c;--on-brand:#ffffff;--gain-text:#4a6600;--warn:#8a5200;--on-warn:#ffffff;--bad:#c21f33;--focus:#0b0b0c;
  --day-c:#12b8a8;--day-e:#8b3dff;--on-day-e:#ffffff;
  --fig:#5b5f66;--fig-far:#a6a9ae;--equip:#dcdcd6;--equip-line:#a2a5aa;--mm-skin:#e9e9e6;--mm-0:#c2c4c8;--mm-nr:#d9dad6;color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-sans);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cond{font-family:var(--font-display);font-weight:700}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + var(--restH,0px) + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:700;text-transform:uppercase}
h1{font-size:44px;line-height:.92;letter-spacing:-.01em}
.wordmark{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0}
h2{font-size:30px;line-height:1}
h3{font-family:var(--font-sans);text-transform:none;font-size:17px;line-height:1.25;font-weight:600;letter-spacing:0}
.muted{color:var(--muted)}.small{font-size:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:17px}
.btn.primary{background:var(--accent);color:var(--on-accent);font-family:var(--font-display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.btn.full{width:100%}
.btn.sm{min-height:40px;font-size:15px;padding:0 12px;border-radius:10px}
.btn.sm.primary{font-size:17px}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{color:var(--bad)}
.chip{display:inline-flex;white-space:nowrap;flex:0 0 auto;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:500;box-shadow:inset 0 0 0 1.5px transparent}
.chip.on{box-shadow:inset 0 0 0 1.5px var(--accent-text);color:var(--accent-text)}
.plate{--c:var(--day-e);--t:var(--on-day);position:relative;display:grid;place-items:center;border-radius:50%;background:var(--c);color:var(--t);aspect-ratio:1;font-family:var(--font-display);font-weight:700;box-shadow:inset 0 0 0 4px rgba(0,0,0,.22),inset 0 0 0 9px var(--c),inset 0 0 0 10.5px rgba(0,0,0,.28)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:12px}
.hero .plate{width:96px;font-size:52px}
.hero h2{font-size:32px;margin-top:2px;text-wrap:balance}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.days button{display:flex;flex-direction:column;align-items:center;gap:4px}
.days .plate{width:100%;max-width:62px;font-size:28px}
.days .tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.cal div.hit{font-family:var(--font-display);font-size:15px;font-weight:700}
.cal div.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .hd{background:none;aspect-ratio:auto;font-weight:600}
.notice{background:var(--surface);border-radius:16px;padding:14px 16px;margin-top:10px}
.notice .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.notice .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.notice.warn .tag{color:var(--warn)}
.notice h3{font-size:18px;margin:6px 0 2px}
.notice p{margin:0 0 10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav button.on{color:var(--accent-text)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.restbar{position:fixed;left:0;right:0;z-index:19;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:0 12px 8px}
.restbar .in{max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.restbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.45;transition:width 1s linear}
.restbar .t{font-family:var(--font-display);font-size:34px;font-weight:700;min-width:80px;position:relative;font-variant-numeric:tabular-nums}
.restbar .lbl{flex:1;font-size:14px;position:relative;line-height:1.2}
.restbar button{position:relative;background:rgba(127,127,127,.28);border-radius:10px;min-width:46px;height:40px;font-weight:600}
.restbar.done .in{background:var(--accent);color:var(--on-accent)}
.sesshead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:-16px -16px 0;padding:12px 16px 10px}
.sesshead .dn{font-family:var(--font-display);font-size:19px;font-weight:700;text-transform:uppercase;line-height:1.05}
.queue{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.queue button{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--surface);font-weight:600;font-size:14px;box-shadow:inset 0 0 0 2px transparent}
.queue button.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.queue button.ok{background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent-text)}
.queue button.part{box-shadow:inset 0 0 0 2px var(--accent-text)}
.queue button.ok.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.exfig{max-width:420px;margin:0 auto}
.exname{font-size:30px;margin-top:12px;line-height:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:14px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-2)}
.pill.up{background:var(--gain);color:var(--on-gain)}
.pill.alt{background:var(--warn);color:var(--on-warn)}
.set{border-top:1px solid var(--line);padding:12px 0}
.set .lab{font-family:var(--font-display);font-size:22px;font-weight:700;width:30px;flex:0 0 auto;color:var(--muted)}
.set.done .lab{color:var(--accent-text)}
.set.done .step,.set.done .rir{opacity:.55}
.step{display:flex;align-items:center;background:var(--surface-2);border-radius:12px;flex:1;min-width:0}
.step button{width:42px;height:52px;font-size:26px;font-weight:500;flex:0 0 auto}
.step .v{flex:1;text-align:center;line-height:1.05;min-width:0}
.step .v b{display:block;font-family:var(--font-display);font-size:28px;font-variant-numeric:tabular-nums}
.step .v span{font-size:12px;color:var(--muted)}
.rir{display:flex;gap:5px;align-items:center;flex:1}
.rir button{width:40px;height:40px;border-radius:10px;background:var(--surface-2);font-weight:600}
.rir button.on{background:var(--ink);color:var(--bg)}
.check{width:58px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:0 0 auto}
.check svg{width:28px;height:28px;stroke:currentColor;stroke-width:3;fill:none}
.set.done .check{background:var(--accent);color:var(--on-accent)}
.set .pr{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gain-text)}
.navbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.bigstat{font-family:var(--font-display);font-size:64px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--surface-2);border-radius:12px;padding:12px}
.stats b{display:block;font-family:var(--font-display);font-size:30px;line-height:1}
.stats span{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar{height:12px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden;margin-top:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--muted)}
.bar.in i{background:var(--gain)}
.bar .zone{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.45}
.list button.item{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;padding:13px 0;border-top:1px solid var(--line);gap:10px}
.list button.item:first-child{border-top:0}
.chart{width:100%;height:auto;display:block}
.chart .ln{stroke:var(--gain-text);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .dt{fill:var(--gain-text);stroke:var(--bg);stroke-width:1.5}
.chart .gr{stroke:var(--line);stroke-width:1;opacity:.55;stroke-dasharray:2 4}
.chart .ga0{stop-color:var(--gain-text);stop-opacity:.22}.chart .ga1{stop-color:var(--gain-text);stop-opacity:0}
.chart .end{fill:var(--gain-text);stroke:var(--bg);stroke-width:2.5}
.chart .endl{fill:var(--ink);font-family:var(--font-display);font-size:15px;font-weight:700}
.chart .tipl{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .tipc{fill:var(--bg);stroke:var(--gain-text);stroke-width:2.5}
.chart .tipb{fill:var(--inverse,var(--ink))}
.chart .tipv{fill:var(--bg);font-family:var(--font-display);font-size:14px;font-weight:700}
.chart .tipd{fill:var(--bg);opacity:.75;font-size:10px}
.chart{touch-action:pan-y;cursor:crosshair}
.chg{color:var(--ink);font-variant-numeric:tabular-nums}.chg.up{color:var(--gain-text)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-sans)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;max-width:90vw;text-align:center}
.tabs{display:flex;gap:6px;overflow-x:auto}
.ed{border-top:1px solid var(--line);padding:12px 0}
.mini{display:flex;align-items:center;gap:4px}
.mini button{width:34px;height:34px;border-radius:9px;background:var(--surface-2);font-weight:600;font-size:18px}
.mini b{min-width:26px;text-align:center}
textarea{min-height:120px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
a.btn{text-decoration:none;color:inherit}
.warm label,.act label{display:flex;align-items:center;gap:10px;padding:6px 0}
.warm input,.act input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* rangos y felicitaciones */
:root{--t0:#6b7079;--t1:#c27a3e;--t2:#b9c0ca;--t3:#e2b43f;--t4:#8fd0e6;--t5:#eef3ff;--on-tier:#0b0b0c}
.rk{--c:var(--t0);display:inline-grid;place-items:center;align-content:center;flex:0 0 auto;width:52px;height:58px;background:var(--c);color:var(--on-tier);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-family:var(--font-display);line-height:1}
.rk b{font-size:10px;letter-spacing:.06em;text-transform:uppercase}.rk i{font-style:normal;font-size:20px;font-weight:700}
.rk.sm{width:80px;height:26px;clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%)}.rk.sm b{font-size:11px}
.rk.lg{width:72px;height:80px}.rk.lg b{font-size:12px}.rk.lg i{font-size:28px}
.rk.xl{width:92px;height:104px}.rk.xl b{font-size:14px}.rk.xl i{font-size:36px}
.rk.t0{--c:var(--t0)}.rk.t1{--c:var(--t1)}.rk.t2{--c:var(--t2)}.rk.t3{--c:var(--t3)}.rk.t4{--c:var(--t4)}.rk.t5{--c:var(--t5)}
.rk.t0{color:#f5f5f2}
.bar.t0 i{background:var(--t0)}.bar.t1 i{background:var(--t1)}.bar.t2 i{background:var(--t2)}.bar.t3 i{background:var(--t3)}.bar.t4 i{background:var(--t4)}.bar.t5 i{background:var(--gain)}
.rkrow{align-items:center!important;justify-content:flex-start!important}
.rkmid{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}.rkmid .bar{margin:2px 0}
.rkname{font-weight:600;line-height:1.2}
.aprox{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 6px;vertical-align:1px}
.ladder{display:flex;flex-direction:column;gap:4px;margin-top:14px}
.lrow{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:10px;padding:6px 8px;border-radius:10px}
.lrow.on{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--accent-text)}
.set .gain{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--gain-text)}
.hito{display:flex;gap:16px;align-items:center;box-shadow:inset 0 0 0 1.5px var(--gain);animation:glow 1.6s ease-out 1}
.hito h2{font-size:28px;margin-top:2px}.hito .plate.hp{width:72px;font-size:36px}
.eyebrow.acc{color:var(--accent-text)}
@keyframes glow{0%{box-shadow:inset 0 0 0 1.5px var(--accent),0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:inset 0 0 0 1.5px var(--accent),0 0 0 18px color-mix(in srgb,var(--accent) 0%,transparent)}}
.ach{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.ach:first-of-type{border-top:0}
.ach .dot{width:8px;height:8px;border-radius:50%;background:var(--gain-text);margin-top:6px;flex:0 0 auto}.ach p{margin:2px 0 0}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--t0:#4f545b;--t2:#9aa3ae;--t5:#dfe7f7}}
:root[data-theme="light"]{--t0:#4f545b;--t2:#9aa3ae;--t5:#dfe7f7}

.road{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:14px}
.road.mini{gap:3px;margin:3px 0}
.rblk{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;--c:var(--t0)}
.rblk.t1{--c:var(--t1)}.rblk.t2{--c:var(--t2)}.rblk.t3{--c:var(--t3)}.rblk.t4{--c:var(--t4)}.rblk.t5{--c:var(--t5)}
.rsegs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100%}
.rseg{position:relative;height:12px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.road.mini .rseg{height:6px;border-radius:2px;box-shadow:none}
.rseg i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c)}
.rseg.cur{box-shadow:inset 0 0 0 1.5px var(--accent-text)}
.rseg .you{position:absolute;top:-19px;transform:translateX(-50%);font-family:var(--font-display);font-size:12px;font-weight:700;text-transform:uppercase;color:var(--on-gain);background:var(--gain);padding:0 4px;border-radius:4px;line-height:15px;white-space:nowrap}
.rlab{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:0;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rkg{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-3px}
.road:not(.mini){margin-top:26px}
.rkhome{display:block;width:100%;text-align:left}
.ladder{gap:8px}
.lrow{display:flex!important;flex-direction:column;align-items:stretch;gap:8px;padding:10px;border-radius:12px}
.lrow.past{opacity:.75}.lrow.next .rk{opacity:.55}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lsubs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lsub{display:flex;flex-direction:column;gap:1px;padding:6px 8px;border-radius:9px;background:var(--surface-2);min-width:0}
.lsub em{font-style:normal;font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--muted)}
.lsub b{font-family:var(--font-display);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsub small{font-size:11px;color:var(--muted)}
.lsub.done{background:color-mix(in srgb,var(--surface-2) 70%,var(--gain) 30%)}
.lsub.done small,.lsub.done em{color:var(--gain-text)}
.lsub.cur{box-shadow:inset 0 0 0 1.5px var(--accent-text)}.lsub.cur small{color:var(--accent-text);font-weight:600}
.lsub.lock{opacity:.7}

.hyd{box-shadow:inset 0 0 0 1.5px var(--water)}
.hyd .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--water)}
.hyd .tag::before{content:"";width:8px;height:10px;background:currentColor;border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.hyd h3{margin:6px 0 2px}.hyd p{margin:0 0 10px}
@media (prefers-reduced-motion:reduce){.hito{animation:none}}


/* cuestionario */
.ob{padding-top:4px}
.ob h1{font-size:48px}
.obq{font-size:34px;line-height:1;margin:8px 0 6px}
.obprog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:14px 0 10px}
.obprog i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .3s}
.obopts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.obopt{min-height:58px;border-radius:14px;background:var(--surface);padding:0 18px;text-align:left;font-size:18px;font-weight:600;box-shadow:inset 0 0 0 2px transparent}
.obopt.on{box-shadow:inset 0 0 0 2px var(--accent-text);color:var(--accent-text)}
.obhero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 16px}
.obhero .hi-fig{aspect-ratio:140/214;max-height:240px;width:auto;margin:0 auto}
.obex{padding:9px 0;border-top:1px solid var(--line);gap:12px}
.obex span{min-width:0}
.obex b{white-space:nowrap}
/* barra de avance de la sesión */
.vprog{position:relative;display:flex;gap:12px;align-items:center;margin-top:10px;background:var(--surface);border-radius:14px;padding:6px 12px 8px 6px}
.vprog .vfig{width:46px;flex:0 0 46px;aspect-ratio:96/214;background:none;margin-left:4px}
.vmid{flex:1;min-width:0}
.vpct{font-family:var(--font-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.vbar{position:relative;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:6px 0 5px}
.vbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px}
.vbar s{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--bg);opacity:.7}
.vmsg{color:var(--ink);font-weight:500;line-height:1.2}

/* ---------- historial ---------- */
const sessList=()=>Object.values(S.sessions).sort((a,b)=>a.start-b.start);
function history(ex){
  const out=[];
  for(const s of sessList())for(const en of s.entries||[]){
    if(en.ex!==ex)continue;const sets=(en.sets||[]).filter(x=>x.done);
    if(sets.length)out.push({t:s.start,sid:s.id,unit:en.unit,sets,best:Math.max(...sets.map(x=>e1(loadOf(ex,x.kg),x.r))),top:Math.max(...sets.map(x=>loadOf(ex,x.kg)))});
  }
  return out;
}
const lastEntry=ex=>{const h=history(ex);return h[h.length-1]||null};
const bestE1=ex=>history(ex).reduce((m,h)=>Math.max(m,h.best),0);
const repsMode=ex=>{const e=EX[ex]||{};if(!(e.bw||e.bwx))return false;return !history(ex).some(h=>h.sets.some(x=>x.kg>0))};
const bestReps=ex=>history(ex).reduce((m,h)=>Math.max(m,...h.sets.filter(x=>!(x.kg>0)).map(x=>x.r)),0);
function progDue(ex,item){const l=lastEntry(ex);if(!l)return false;return l.sets.length>=Math.min(item.s,l.sets.length)&&l.sets.every(x=>x.r>=item.hi&&(x.rir==null||x.rir>=1))}

/* ---------- sesión ---------- */
function makeEntry(item,ex,deload){
  const last=lastEntry(ex);
  const unit=S.config.units[ex]||(last?last.unit:'kg');
  const n=deload?Math.max(1,Math.ceil(item.s/2)):item.s;
  const up=!deload&&progDue(ex,item);
  const step=stepOf(ex,unit);
  const sets=[];
  for(let i=0;i<n;i++){
    const ls=last?(last.sets[i]||last.sets[last.sets.length-1]):null;
    let w=ls?roundTo(fromKg(ls.kg,unit),step):0;
    const pureBW=isBW(ex)&&w===0;
    if(up&&!pureBW)w+=EX[ex]&&EX[ex].as?-step:step;
    w=Math.max(0,w);
    if(deload)w=roundTo(w*0.9,step);
    sets.push({w,r:ls?(up?(pureBW?ls.r+1:item.lo):ls.r):item.lo,rir:2,done:false});
  }
  return{ex,unit,sets,notes:[],up};
}

/* ---------- cálculos ---------- */
function weekSets(ws){return setsBetween(ws,ws+7*DAY)}
function nextDay(){
  const fxk=fixedDays(),opt=Object.keys(DAYS).filter(k=>!DAYS[k].fx);
  const fx=sessList().filter(s=>DAYS[s.day]&&DAYS[s.day].fx&&s.start>=(S.config.routineAt||0));
  const ws=weekStart(Date.now());
  const thisWeek=fx.filter(s=>s.start>=ws).length;
  if(thisWeek>=fxk.length&&opt.length)return opt[0];
  if(!fx.length)return fxk[0]||Object.keys(DAYS)[0];
  const i=fxk.indexOf(fx[fx.length-1].day);return fxk[(i+1)%fxk.length];
}
function weekCount(ws){return sessList().filter(s=>s.start>=ws&&s.start<ws+7*DAY&&DAYS[s.day]&&DAYS[s.day].fx).length}
function streak(){
  let ws=weekStart(Date.now()),n=0;
  if(weekCount(ws)>=NFX())n++;
  ws-=7*DAY;
  while(weekCount(ws)>=NFX()){n++;ws-=7*DAY}
  return n;
}
function dropDetected(){
  for(const d of Object.keys(DAYS)){
    const ss=sessList().filter(s=>s.day===d).slice(-3);
    if(ss.length<3)continue;
    const score=s=>s.entries.reduce((a,en)=>a+Math.max(0,...en.sets.filter(x=>x.done).map(x=>e1(x.kg,x.r))),0);
    const [a,b,c]=ss.map(score);
    if(c<b&&b<a&&!ss[2].deload)return true;
  }
  return false;
}
function summaryOf(s){
  let sets=0,vol=0,reps=0;const prs=[],mus={};
  for(const en of s.entries){const asx=EX[en.ex]&&EX[en.ex].as;for(const x of en.sets){if(!x.done)continue;sets++;reps+=x.r;if(!asx)vol+=x.kg*x.r;if(x.pr)prs.push({ex:en.ex,x});const m=EX[en.ex]&&EX[en.ex].m;if(m)mus[m]=(mus[m]||0)+1}}
  const prev=sessList().filter(o=>o.day===s.day&&o.start<s.start).pop();
  let pv=null;if(prev){pv=0;prev.entries.forEach(en=>{if(EX[en.ex]&&EX[en.ex].as)return;en.sets.forEach(x=>{if(x.done)pv+=x.kg*x.r})})}
  return{sets,vol,reps,prs,mus,pv,dur:(s.end||Date.now())-s.start};
}
function review(){
  const cut=Date.now()-30*DAY,rows=[];
  const exs=new Set();sessList().forEach(s=>s.entries.forEach(en=>exs.add(en.ex)));
  exs.forEach(ex=>{
    const h=history(ex).filter(x=>x.t>=cut);if(h.length<2)return;
    const first=h[0].best,last=Math.max(...h.slice(-2).map(x=>x.best));
    const pct=first?((last-first)/first)*100:0;
    rows.push({ex,pct,n:h.length,state:pct>1.5?'up':pct<-1.5?'down':'flat'});
  });
  return rows.sort((a,b)=>a.pct-b.pct);
}
function reviewText(rows){
  const lab={up:'avanzó',flat:'estancado',down:'bajó'};
  let t='Revisión mensual de entrenamiento ('+todayStr()+')\n';
  t+='Sesiones en 30 días: '+sessList().filter(s=>s.start>=Date.now()-30*DAY).length+'\n';
  rows.forEach(r=>t+='- '+EX[r.ex].n+': '+lab[r.state]+' ('+(r.pct>=0?'+':'')+num(r.pct)+'% en 1RM estimado, '+r.n+' sesiones)\n');
  const ws=weekSets(weekStart(Date.now())-7*DAY);
  t+='Series la semana pasada por músculo: '+Object.keys(MUS).map(k=>MUS[k][0]+' '+ws[k]).join(', ')+'\n';
  const m=S.body.m[S.body.m.length-1];if(m&&m.hombro&&m.cintura)t+='Proporción hombro/cintura: '+(m.hombro/m.cintura).toFixed(2)+'\n';
  const w=S.body.w[S.body.w.length-1];if(w)t+='Peso corporal: '+w.kg+' kg\n';
  return t;
}

const TIERS=[['Hierro','t0'],['Bronce','t1'],['Plata','t2'],['Oro','t3'],['Platino','t4'],['Diamante','t5']];
const PCT=[5,20,50,80,95];
const SUBS=['III','II','I'];
const bw=()=>{const w=S.body.w;return w.length?w[w.length-1].kg:null};
function interpRows(xs,rows,b){
  const x=Math.max(xs[0],Math.min(xs[xs.length-1],b));
  let i=0;while(i<xs.length-2&&x>xs[i+1])i++;
  const u=(x-xs[i])/(xs[i+1]-xs[i]);
  return rows[i].map((v,k)=>v+(rows[i+1][k]-v)*u);
}
function thresholds(key,b){
  const f=sexOf()==='f';
  if(REPS[key]){const t=REPS[key][f?'F':'M'];return interpRows(t.bwLb.map(v=>v/LB),t.r,b)}
  const t=(f?STD_F:STD)[key];if(!t)return null;
  if(Array.isArray(t))return interpRows(f?SBW_F:SBW,t,b);
  return interpRows(t.bwLb.map(v=>v/LB),t.r.map(r=>r.map(v=>v/LB)),b);
}
/* curva de percentil por tramos: 0 kg → 0 %, umbrales → 5/20/50/80/95 %, arriba de Élite sube hasta 99 % */
function curve(th,signed){const lo=signed?th[0]-(th[1]-th[0]):0;return[[lo,0],...th.map((v,k)=>[v,PCT[k]]),[th[4]*1.25+(signed?20:0),99]]}
function pctOf(v,th,signed){const c=curve(th,signed);if(v<=c[0][0])return 0;for(let i=1;i<c.length;i++)if(v<=c[i][0])return c[i-1][1]+(c[i][1]-c[i-1][1])*(v-c[i-1][0])/(c[i][0]-c[i-1][0]);return 99}
function kgOf(p,th,signed){const c=curve(th,signed);for(let i=1;i<c.length;i++)if(p<=c[i][1])return c[i-1][0]+(c[i][0]-c[i-1][0])*(p-c[i-1][1])/(c[i][1]-c[i-1][1]);return c[c.length-1][0]}
const TB=[0,5,20,50,80,95,99];
function tierOf(p){let t=0;while(t<5&&p>=TB[t+1])t++;const lo=TB[t],hi=TB[t+1],f=(p-lo)/(hi-lo);const s=f<1/3?0:f<2/3?1:2;return{t,s,idx:t*3+s,name:TIERS[t][0]+' '+SUBS[s],cls:TIERS[t][1]}}
function nextStep(p){const t=tierOf(p);const lo=TB[t.t],hi=TB[t.t+1];if(t.idx>=17)return null;const s=t.s+1;if(s<3)return{p:lo+(hi-lo)*s/3,name:TIERS[t.t][0]+' '+SUBS[s]};return{p:hi,name:TIERS[t.t+1][0]+' III'}}
/* 1RM de referencia de un ejercicio: mejor serie de las últimas 8 semanas, solo series de hasta 15 repeticiones si las hay */
function rankOf(ex,opts){
  opts=opts||{};const map=RK[ex],b=bw();if(!map||!b)return null;
  const cut=(opts.at||Date.now())-56*DAY;let best=0,hiRep=false,n=0;
  const win=fn=>{for(const s of sessList()){if(s.start<cut||(opts.exclude&&s.id===opts.exclude)||(opts.at&&s.start>opts.at))continue;for(const en of s.entries||[]){if(en.ex!==ex)continue;for(const x of en.sets||[])if(x.done)fn(x)}}(opts.extra||[]).forEach(fn)};
  let key=map[0];
  if(EX[ex]&&EX[ex].bwx){let w=false;win(x=>{if(x.kg>0)w=true});if(!w)key='pullReps'}
  if(REPS[key]){
    win(x=>{if(!(x.kg>0)&&x.r>best)best=x.r});if(!best)return null;
    const th=thresholds(key,b);if(!th)return null;
    const p=pctOf(best,th,false),t=tierOf(p),nx=nextStep(p);
    return{ex,e1:best,val:best,th,signed:false,reps:true,p,t,nx,need:nx?Math.max(1,Math.ceil(kgOf(nx.p,th,false)-best)):0,exact:!!map[1],hiRep:false,ratio:null};
  }
  for(const s of sessList()){if(s.start<cut||(opts.exclude&&s.id===opts.exclude)||(opts.at&&s.start>opts.at))continue;for(const en of s.entries||[]){if(en.ex!==ex)continue;for(const x of en.sets||[]){if(!x.done)continue;n++;const v=x.r<=15?e1(loadOf(ex,x.kg),x.r):0;if(v>best)best=v}}}
  if(opts.extra)opts.extra.forEach(x=>{const v=x.r<=15?e1(loadOf(ex,x.kg),x.r):0;if(v>best)best=v});
  if(!best){for(const s of sessList()){if(s.start<cut||(opts.exclude&&s.id===opts.exclude))continue;for(const en of s.entries||[])if(en.ex===ex)for(const x of en.sets||[])if(x.done){const v=e1(loadOf(ex,x.kg),x.r);if(v>best){best=v;hiRep=true}}}}
  if(!best)return null;
  const signed=key==='pullup',th=thresholds(key,b);if(!th)return null;
  const val=signed?best-b:best; /* dominadas: 1RM de la carga total menos el peso corporal */
  const p=pctOf(val,th,signed),t=tierOf(p),nx=nextStep(p);
  return{ex,e1:best,val,th,signed,p,t,nx,need:nx?Math.max(0,kgOf(nx.p,th,signed)-val):0,exact:!!map[1],hiRep,ratio:signed?null:best/b};
}
function globalRank(){
  const rs=[];const seen={};
  for(const d of Object.keys(DAYS))for(const it of S.config.routine[d]||[]){if(seen[it.ex])continue;seen[it.ex]=1;const r=rankOf(it.ex);if(r)rs.push({r,w:it.main?2:1})}
  if(!rs.length)return null;
  const p=rs.reduce((a,x)=>a+x.r.p*x.w,0)/rs.reduce((a,x)=>a+x.w,0);
  return{p,t:tierOf(p),nx:nextStep(p),n:rs.length,list:rs.map(x=>x.r)};
}

const loadOf=(ex,kg)=>{const e=EX[ex]||{};return e.as?Math.max(0,(bw()||70)-kg):e.bwx?(bw()||70)+kg:kg};

const HITO_SES=[1,10,25,50,100,200,300];

function snapshot(exs){
  const o={n:sessList().length,wk:weekCount(weekStart(Date.now())),st:streak(),g:globalRank(),rk:{},b:{},first:{}};
  [...new Set(exs)].forEach(ex=>{o.rk[ex]=rankOf(ex);o.b[ex]=bestE1(ex);const h=history(ex);o.first[ex]=h.length?h[0].best:0});
  return o;

function achievements(s,bf){
  const big=[],small=[];
  const n=sessList().length;
  HITO_SES.forEach(k=>{if(bf.n<k&&n>=k)big.push({k:'ses',h:k===1?'Primer entrenamiento':k+' entrenamientos',p:k===1?'Registraste tu primera sesión en Hierro.':'Llevas '+k+' sesiones registradas desde que empezaste.'})});
  const wk=weekCount(weekStart(Date.now()));
  if(DAYS[s.day]&&DAYS[s.day].fx&&bf.wk<NFX()&&wk>=NFX())big.push({k:'sem',h:'Semana completa',p:NFX()+' de '+NFX()+' días fijos esta semana.'});
  const st=streak();HITO_RACHA.forEach(k=>{if(bf.st<k&&st>=k)big.push({k:'racha',h:'Racha de '+k+' semanas',p:k+' semanas seguidas cumpliendo tus '+NFX()+' días fijos.'})});
  for(const en of s.entries){
    const ex=en.ex,name=(EX[ex]||{n:ex}).n,it=(S.config.routine[s.day]||[]).find(x=>x.ex===ex)||{};
    const gains=en.sets.filter(x=>x.g).map(x=>x.g);
    if(en.sets.some(x=>x.pr))small.push({h:'Récord en '+name,p:repsMode(ex)?'Tu mejor serie: '+bestReps(ex)+' repeticiones':'Tu mejor 1RM estimado: '+num(bestE1(ex))+' kg'});
    else if(gains.length)small.push({h:name,p:gains.length+(gains.length>1?' series mejores':' serie mejor')+' que la vez pasada ('+gains.join(', ')+')'});
    const r0=bf.rk[ex],r1=rankOf(ex);
    if(r1&&(!r0||r1.t.idx>r0.t.idx)){
      if(!r0||r1.t.t>r0.t.t)big.push({k:'rango',t:r1.t,h:r0?TIERS[r1.t.t][0]+' en '+name:'Tu primer rango en '+name,p:(r0?'Subiste de '+r0.t.name+' a '+r1.t.name:'Empiezas en '+r1.t.name)+'. '+(r1.reps?'Mejor serie '+num(r1.val)+' reps':'1RM estimado '+num(r1.e1)+' kg')+': más fuerte que ~'+Math.round(r1.p)+' % de los '+gente()+' de tu peso.'});
      else small.push({h:'Subiste a '+r1.t.name,p:name+' · '+(r1.reps?'mejor serie '+num(r1.val)+' reps':'1RM estimado '+num(r1.e1)+' kg')});
    }
    const f=bf.first[ex],b0=bf.b[ex],b1=bestE1(ex);
    if(f>0&&it.main)HITO_1RM.forEach(([q,isBig])=>{if(b0<f*(1+q)&&b1>=f*(1+q)){const o={h:'+'+Math.round(q*100)+' % de fuerza en '+name,p:'1RM estimado de '+num(f)+' a '+num(b1)+' kg desde tu primera sesión.'};(isBig?big:small).push(o)}});
  }
  const g1=globalRank(),g0=bf.g;
  if(g1&&(!g0||g1.t.idx>g0.t.idx)){if(!g0||g1.t.t>g0.t.t)big.push({k:'global',t:g1.t,h:'Rango global '+g1.t.name,p:'Promedio de tus '+g1.n+' ejercicios con referencia.'});else small.push({h:'Rango global: '+g1.t.name,p:'Promedio de tus '+g1.n+' ejercicios con referencia.'})}
  return{big,small};
}


/* ---------- hidratación ----------
   Pérdida estimada por serie = tasa base × factor del ejercicio × (trabajo 45 s + descanso) × peso/70 × calor.
   Tasa base 0.6 L/h a 70 kg: estimación de diseño para hipertrofia con descansos (no hay una tasa medida para este tipo de sesión).
   Meta del ACSM: no perder más del 2 % del peso corporal; en pesas lo común es tomar de más, por eso se sugiere ~80 % de lo estimado. */
const HYD={base:600,f:{h:1.25,m:1,i:0.75},trig:200};
function setLoss(ex,item){const t=(EX[ex]||{t:'i'}).t,rest=item&&item.ss?0:REST[t];return HYD.base*HYD.f[t]*((45+rest)/3600)*((bw()||70)/70)*(S.config.hot?1.3:1)}
const r50=v=>Math.round(v/50)*50;
function hydSuggest(p){return Math.max(150,Math.min(400,r50(p*0.8)))}
function hydCard(A){
  const H=A.hyd;if(!H||H.pend<HYD.trig||H.pend<(H.snooze||0))return '';
  const ml=hydSuggest(H.pend);
  return `<div class="card hyd" role="status"><div class="row between"><span class="tag">Agua</span><span class="small muted">${H.n} ${H.n===1?'ejercicio terminado':'ejercicios terminados'}</span></div>
  <h3>Toma ~${ml} mL ahora</h3><p class="small muted">${ml>=250?'Un vaso':ml>=200?'Casi un vaso':'Medio vaso'}. Llevas ~${r50(H.loss)} mL de sudor estimado y ${r50(H.drank)} mL tomados.</p>
  <div class="row"><button class="btn sm primary" data-a="drink" data-v="${ml}">Ya tomé</button><button class="btn sm ghost" data-a="drinkLater">Más tarde</button></div></div>`;
}

/* ---------- cuestionario y generador de rutina ----------
   Volumen: 10 o más series directas por músculo a la semana rinden más que 5 a 9 (Schoenfeld, Ogborn y Krieger 2017, metaanálisis);
   arriba de ~20 el beneficio extra se achica. Frecuencia: con el mismo volumen, entrenar un músculo 1 o 2+ veces por semana da
   resultados parecidos (Schoenfeld, Grgic y Krieger 2019), así que los días solo reparten el volumen. Salud general: la OMS pide
   fuerza para los grupos principales 2 o más días por semana. Rangos de repeticiones por objetivo: práctica común, no regla fija. */
const POOL={
  hpush:{g:['plano_maquina','inc_mancuernas','inc_maquina','inc_smith','plano_mancuernas'],d:['plano_mancuernas','inc_mancuernas'],b:['lagartijas']},
  vpush:{g:['press_hombro_mancuernas'],d:['press_hombro_mancuernas'],b:['pike']},

  hpull:{g:['remo_apoyado','remo_abierto','remo_maquina','remo_mancuerna'],d:['remo_mancuerna'],b:['remo_invertido']},
  squat:{g:['prensa','hack','smith_pies'],d:['goblet'],b:['sentadilla_libre']},
  single:{g:['bulgara','smith_pies'],d:['bulgara'],b:['zancadas']},
  hinge:{g:['rdl_mancuernas'],d:['rdl_mancuernas'],b:['rdl_una_pierna']},
  glute:{g:['hip_thrust','hip_smith'],d:['hip_db'],b:['puente_gluteo']},
  legcurl:{g:['femoral_sentado','femoral_acostado'],d:[],b:[]},
  legext:{g:['ext_cuad'],d:[],b:[]},
  calf:{g:['pantorrilla'],d:['pantorrilla_db'],b:['pantorrilla_bw']},
  fly:{g:['cruce_polea','pec_deck'],d:[],b:[]},
  lateral:{g:['laterales','laterales_polea'],d:['laterales'],b:[]},
  rear:{g:['face_pull','pajaros'],d:['remo_abierto_db'],b:[]},
  biceps:{g:['curl_inclinado','curl_polea','martillo','martillo_cuerda'],d:['curl_inclinado','martillo'],b:[]},
  triceps:{g:['jalon_cuerda','ext_nuca_polea','jalon_barra','frances_inclinado'],d:['ext_tri_db','frances_inclinado'],b:['fondos_banco']},
  abs:{g:['crunch_polea','crunch_maquina'],d:['crunch_suelo'],b:['crunch_suelo']}
};
const PAT_M={hpush:'pecho',vpush:'hant',vpull:'espalda',hpull:'espalda',squat:'cuad',single:'cuad',hinge:'fem',glute:'glut',legcurl:'fem',legext:'cuad',calf:'pant',fly:'pecho',lateral:'hlat',rear:'hpost',biceps:'biceps',triceps:'triceps',abs:'abs'};
const PAT_FB={vpull:['hpull'],hpull:['vpull'],vpush:['lateral','hpush'],fly:['hpush'],lateral:['rear','vpush'],rear:['hpull'],biceps:['hpull'],triceps:['hpush'],legcurl:['hinge','glute'],legext:['single','squat'],hinge:['glute','legcurl'],glute:['hinge'],single:['squat'],squat:['single']};
const BENCH=['inc_mancuernas','plano_mancuernas','frances_inclinado','curl_inclinado'];
const INJ={hombro:['pike','press_hombro_mancuernas','fondos_banco','ext_nuca_polea','ext_tri_db','dominadas'],rodilla:['zancadas','bulgara','hack'],espalda:['rdl_mancuernas','rdl_una_pierna']};
const PRIO={pecho:['pecho'],espalda:['espalda'],hombro:['hlat','hant','hpost'],brazos:['biceps','triceps'],pierna:['cuad','fem'],gluteo:['glut']};
const PRIO_N={pecho:'Pecho',espalda:'Espalda',hombro:'Hombro',brazos:'Brazos',pierna:'Pierna',gluteo:'Glúteo'};
const TPL={
  2:[['Cuerpo completo A',['squat','hpush','hpull','hinge','lateral','triceps','biceps','calf']],
     ['Cuerpo completo B',['glute','vpull','hpush:1','single','vpush','rear','abs','legcurl']]],
  3:[['Cuerpo completo A',['squat','hpush','hpull','legcurl','lateral','triceps','abs','calf']],
     ['Cuerpo completo B',['hinge','vpull','vpush','legext','fly','biceps','rear']],
     ['Cuerpo completo C',['glute','hpush:1','hpull:1','single','lateral','biceps','triceps']]],
  4:[['Torso A',['hpush','hpull','vpush','vpull','lateral','triceps','biceps']],
     ['Pierna A',['squat','legcurl','glute','legext','calf','abs','single']],
     ['Torso B',['hpush:1','vpull:1','hpull:1','fly','rear','biceps:1','triceps:1']],
     ['Pierna B',['hinge','single','glute:1','legcurl:1','calf','abs','legext']]],
  5:[['Torso',['hpush','hpull','vpush','vpull','lateral','biceps','triceps']],
     ['Pierna A',['squat','legcurl','glute','legext','calf','abs','single']],
     ['Empuje: pecho, hombro y tríceps',['hpush:1','vpush','fly','lateral','triceps:1','abs']],
     ['Tirón: espalda y bíceps',['vpull:1','hpull:1','hpull:2','rear','biceps:1','biceps']],
     ['Pierna B',['hinge','single','glute:1','legcurl:1','calf','legext']]]
};
/* con solo peso corporal hay pocos ejercicios de torso: con 4 o 5 días se queda en cuerpo completo */
const TPL_BW={4:TPL[3].concat([['Cuerpo completo D',['single','hpush','hpull','glute','vpush','calf','abs']]]),
  5:TPL[3].concat([['Cuerpo completo D',['single','hpush','hpull','glute','vpush','calf','abs']],['Cuerpo completo E',['squat','vpull','hpush','hinge','triceps','abs']]])};
const HIREP=['laterales','laterales_polea','face_pull','pajaros','pantorrilla','pantorrilla_db','pantorrilla_bw','remo_abierto_db','crunch_polea','crunch_maquina','crunch_suelo'];
function exOk(id,p){
  if(!EX[id])return false;
  if(id==='dominadas'&&!p.bar)return false;
  if(p.eq==='d'&&!p.bench&&BENCH.includes(id))return false;
  return !(p.inj||[]).some(z=>(INJ[z]||[]).includes(id));
}
function candidates(pat,p){
  const P=POOL[pat];if(!P)return[];
  const list=p.eq==='g'?P.g.concat(P.d,P.b):p.eq==='d'?P.d.concat(P.b):P.b;
  return [...new Set(list)].filter(id=>exOk(id,p));
}
function pickEx(pat,v,used,p,depth){
  const c=candidates(pat,p).filter(id=>!used.includes(id));
  if(c.length)return{ex:c[v%c.length],pat};
  if((depth||0)>=2)return null;
  for(const f of PAT_FB[pat]||[]){const r=pickEx(f,v,used,p,(depth||0)+1);if(r)return r}
  return null;
}
function repsFor(id,role,p){
  const e=EX[id];
  if(e.bw||e.bwx)return ['dominadas','pike','remo_invertido'].includes(id)?[5,12]:p.exp==='new'?[8,15]:[10,20];
  if(p.goal==='fza')return role==='main'?(p.exp==='new'?[5,8]:[3,6]):role==='comp'?[6,10]:[8,12];
  if(p.goal==='salud')return role==='iso'?[10,15]:[8,12];
  if(role==='main')return[6,10];
  if(role==='comp')return[8,12];
  return HIREP.includes(id)?[12,20]:[10,15];
}
function muscleTarget(m,p){
  const base=p.goal==='salud'?(p.exp==='adv'?8:6):({new:10,mid:12,adv:14}[p.exp]||10);
  let t=['pecho','espalda','cuad'].includes(m)?base:['glut','fem','hlat'].includes(m)?base*0.8:['biceps','triceps','hpost'].includes(m)?base*0.7:['pant','abs'].includes(m)?(p.goal==='salud'?3:Math.min(base,8)*0.75):0;
  const pr=(p.prio||[]).some(k=>(PRIO[k]||[]).includes(m));
  if(pr)t=Math.max(t,base)+4;
  return Math.round(t);
}
const estMin=items=>Math.round(5+items.reduce((a,it)=>a+it.s*(40+restOf(it,it.ex))/60,0));
function genRoutine(p){
  const tpl=(p.eq==='b'&&TPL_BW[p.days])||TPL[p.days]||TPL[3],slots=p.mins>=75?7:p.mins>=60?6:5;
  const keys='ABCDE'.split('').slice(0,tpl.length);
  const days={},routine={},prioM=[].concat(...(p.prio||[]).map(k=>PRIO[k]||[]));
  tpl.forEach(([name,pats],di)=>{
    const k=keys[di];
    /* los dos primeros son los principales; lo prioritario sube para no quedar fuera por tiempo */
    let order=pats.slice(0,2).concat(pats.slice(2).filter(s=>prioM.includes(PAT_M[s.split(':')[0]])),pats.slice(2).filter(s=>!prioM.includes(PAT_M[s.split(':')[0]])));
    const used=[],items=[];
    for(const s of order){
      if(items.length>=slots)break;
      const [pat,v]=s.split(':');const r=pickEx(pat,+(v||0),used,p);if(!r)continue;
      used.push(r.ex);items.push({ex:r.ex});
    }
    let mains=0;
    routine[k]=items.map(it=>{
      const e=EX[it.ex],comp=e.t!=='i',role=comp&&mains<2?(mains++,'main'):comp?'comp':'iso';
      const [lo,hi]=repsFor(it.ex,role,p);
      return R(it.ex,3,lo,hi,Object.assign(role==='main'?{main:1}:{},role==='main'&&p.goal==='fza'&&!(e.bw||e.bwx)?{rs:210}:{}));
    });
    days[k]={n:name,fx:1};
  });
  /* reparte series hasta la meta semanal de cada músculo */
  const allItems=()=>[].concat(...keys.map(k=>routine[k]));
  const balance=()=>{const all=allItems();Object.keys(MUS).forEach(m=>{
    const tg=muscleTarget(m,p),its=all.filter(it=>EX[it.ex].m===m);if(!tg||!its.length)return;
    let tot=its.reduce((a,it)=>a+it.s,0),guard=0;
    while(tot<tg&&guard++<40){const c=its.filter(it=>it.s<5).sort((a,b)=>a.s-b.s)[0];if(!c)break;c.s++;tot++}
    while(tot>tg+3&&guard++<80){const c=its.filter(it=>it.s>2).sort((a,b)=>b.s-a.s)[0];if(!c)break;c.s--;tot--}
  })};
  balance();
  /* músculo prioritario sin suficientes ejercicios: agrega uno en el día que tenga más espacio */
  const M_PATS={glut:['glute'],pecho:['hpush','fly'],espalda:['hpull','vpull'],hlat:['lateral'],hant:['vpush'],hpost:['rear'],biceps:['biceps'],triceps:['triceps'],cuad:['squat','single','legext'],fem:['legcurl','hinge']};
  [...new Set(prioM)].forEach(m=>{
    const tg=muscleTarget(m,p);let tries=0;
    while(tries++<keys.length){
      const its=allItems().filter(it=>EX[it.ex].m===m),tot=its.reduce((a,it)=>a+it.s,0);
      if(tot>=tg||its.length*4>=tg)break;
      const UP=['pecho','espalda','hlat','hant','hpost','biceps','triceps'],up=UP.includes(m);
      const fit=k=>routine[k].some(it=>UP.includes(EX[it.ex].m)===up)?0:1,has=k=>routine[k].some(it=>EX[it.ex].m===m)?1:0;
      const order=keys.slice().sort((a,b)=>fit(a)-fit(b)||has(a)-has(b)||estMin(routine[a])-estMin(routine[b]));
      let done=false;
      for(const k of order){
        const used=routine[k].map(it=>it.ex);let r=null;
        for(const pat of M_PATS[m]||[]){const c=candidates(pat,p).filter(id=>!used.includes(id)&&EX[id].m===m);if(c.length){r=c[tries%c.length];break}}
        if(!r)continue;
        const e=EX[r],[lo,hi]=repsFor(r,e.t!=='i'?'comp':'iso',p),it=R(r,3,lo,hi);
        if(routine[k].length<=slots)routine[k].push(it);
        else{const j=routine[k].map((x,i)=>i).reverse().find(i=>!routine[k][i].main&&!prioM.includes(EX[routine[k][i].ex].m));if(j==null)continue;routine[k][j]=it}
        done=true;break;
      }
      if(!done)break;
    }
  });
  balance();
  const all=allItems();
  /* que cada día quepa en el tiempo disponible */
  keys.forEach(k=>{
    const its=routine[k];let guard=0;
    while(estMin(its)>p.mins+3&&guard++<40){
      const c=its.filter(it=>!it.main&&it.s>2).sort((a,b)=>b.s-a.s)[0]||its.filter(it=>it.s>2).sort((a,b)=>b.s-a.s)[0];
      if(!c)break;c.s--;
    }
  });
  const vol={};Object.keys(MUS).forEach(m=>vol[m]=0);all.forEach(it=>vol[EX[it.ex].m]+=it.s);
  const est={};keys.forEach(k=>est[k]=estMin(routine[k]));
  return{days,routine,vol,est};
}

  if(from===to||reduce){draw(to);PROG.shown=to;return}
  if(Math.round(to-from)>=1){const c=document.createElement('span');c.className='vchip';c.textContent='+'+Math.round(to-from)+' %';el.appendChild(c);setTimeout(()=>c.remove(),1400)}

  draw(from);PROG.raf=requestAnimationFrame(step);
}

  back:[['hpost',60,90,'L'],['triceps',52,136,'L'],['fem',76,292,'L'],['pant',79,346,'L'],['espalda',82,150,'R'],['glut',84,244,'R']]

/* curva suave cerrada que pasa por los puntos (Catmull-Rom → Bézier) */
function mmPath(pts){
  const n=pts.length,f=v=>Math.round(v*10)/10;let d='M'+f(pts[0][0])+' '+f(pts[0][1]);
  for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(p2[1]-(p3[1]-p1[1])/6)+' '+f(p2[0])+' '+f(p2[1])}
  return d+'Z';
}
const mmMir=pts=>pts.map(([x,y])=>[200-x,y]);
const mmHalf=h=>h.concat(mmMir(h.slice(1,-1)).reverse());

  s+='</g>';
  const angs=new Set();
  const groups={};MM[view].forEach(([k,g,a])=>{(groups[k]=groups[k]||[]).push([g,a]);angs.add(a);angs.add((180-a+360)%180)});
  let defs='<defs>'+[...angs].map(a=>`<pattern id="${pf}fb${a}" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(${a})"><line x1="0.6" y1="0" x2="0.6" y2="2.6" class="fbl"/></pattern>`).join('')+'</defs>';
  const keys=Object.keys(groups).sort((a,b)=>(a===sel)-(b===sel));
  for(const k of keys){
    const f=fillOf(k),cls='mm-m'+(MM_NR[k]?' nr':'')+(sel===k?' sel':''),lab=(MUS[k]||MM_NR[k]||[k])[0];
    let body='';

      const aa=mir?(180-a+360)%180:a;let el;
      if(g.r){const [x,y,w,hh]=g.r,X=mir?200-x-w:x;el=`x="${X}" y="${y}" width="${w}" height="${hh}" rx="3"`;body+=`<rect ${el}/><rect class="fib" ${el} fill="url(#${pf}fb${aa})"/>`}
      else{const d=mmPath(mir?mmMir(g):g);body+=`<path d="${d}"/><path class="fib" d="${d}" fill="url(#${pf}fb${aa})"/>`}
    })});
    s+=`<g class="${cls}${f.cls?' '+f.cls:''}" style="--mf:${f.c}${f.d?';--d:'+f.d:''}" ${labOf?`data-a="mmSel" data-v="${k}" role="button" tabindex="0"`:'role="img"'} data-k="${k}" aria-label="${esc(lab)}${f.t?': '+esc(f.t):''}">${body}</g>`;
  }
  /* etiquetas con % junto al cuerpo */
  let lb='';
  if(labOf)['L','R'].forEach(side=>{
    const L=MM_LAB[view].filter(x=>x[3]===side).map(x=>({k:x[0],ax:side==='L'?x[1]:200-x[1],ay:x[2],y:x[2]})).sort((a,b)=>a.y-b.y);
    for(let i=1;i<L.length;i++)if(L[i].y<L[i-1].y+36)L[i].y=L[i-1].y+36;
    L.forEach(o=>{const v=labOf(o.k),tx=side==='L'?-58:258,ex=side==='L'?-4:204,an=side==='L'?'start':'end';
      lb+=`<g class="mm-lab${sel===o.k?' sel':''}${v.up?' up':''}" data-a="mmSel" data-v="${o.k}"><polyline points="${o.ax},${o.ay} ${ex},${o.y+2}"/><circle cx="${o.ax}" cy="${o.ay}" r="1.8"/><text x="${tx}" y="${o.y-4}" text-anchor="${an}" class="ln1">${MM_SHORT[o.k]}</text><text x="${tx}" y="${o.y+12}" text-anchor="${an}" class="ln2">${v.t}</text></g>`});
  });
  return `<svg viewBox="${labOf?'-62 4 324 432':'26 4 148 432'}" class="mm-svg" aria-label="Cuerpo de ${view==='front'?'frente':'espalda'}">${defs}${s}${lb}</svg>`;

/* ---------- mapa muscular: datos ----------
   Fuerza: base = mejor 1RM estimado (o mejores repeticiones con peso corporal) de las 2 primeras sesiones de cada ejercicio;
   avance = mejor de las 2 sesiones más recientes desde la tercera. El % de un músculo promedia sus ejercicios según las series de las últimas 8 semanas.
   Mide fuerza, no tamaño del músculo: al inicio la fuerza sube sobre todo por aprendizaje del sistema nervioso. */
const SEC={
  inc_mancuernas:['hant','triceps'],inc_smith:['hant','triceps'],inc_maquina:['hant','triceps'],plano_maquina:['hant','triceps'],plano_mancuernas:['hant','triceps'],lagartijas:['hant','triceps'],
  press_hombro_mancuernas:['triceps','hlat'],pike:['triceps','hlat'],fondos_banco:['hant','pecho'],
  jalon_pecho:['biceps','hpost'],dominada_asistida:['biceps','hpost'],dominadas:['biceps','hpost'],remo_apoyado:['biceps','hpost'],remo_mancuerna:['biceps','hpost'],
  remo_abierto:['hpost','biceps'],remo_maquina:['hpost','biceps'],remo_invertido:['biceps','hpost'],remo_abierto_db:['espalda'],face_pull:['espalda'],
  prensa:['glut'],hack:['glut'],smith_pies:['glut'],goblet:['glut'],bulgara:['glut'],sentadilla_libre:['glut'],zancadas:['glut'],rdl_mancuernas:['glut'],rdl_una_pierna:['glut']
};
function setsBetween(t0,t1){
  const out={};Object.keys(MUS).forEach(k=>out[k]=0);
  for(const s of sessList()){if(s.start<t0||s.start>=t1)continue;for(const en of s.entries){const e=EX[en.ex];if(!e)continue;const d=en.sets.filter(x=>x.done).length;if(!d)continue;out[e.m]+=d;(SEC[en.ex]||[]).forEach(k=>{if(k in out)out[k]+=d/2})}}
  return out;
}
function exGain(id,at){
  const h=history(id).filter(x=>!at||x.t<=at),rm=repsMode(id);
  const val=x=>rm?Math.max(0,...x.sets.filter(s=>!(s.kg>0)).map(s=>s.r)):x.best;
  if(h.length<3)return{cal:true,n:h.length,rm};
  const base=Math.max(val(h[0]),val(h[1])),cur=Math.max(...h.slice(2).slice(-2).map(val));
  if(!base)return{cal:true,n:h.length,rm};
  return{cal:false,n:h.length,rm,base,cur,pct:(cur/base-1)*100};
}
function musclePctAt(m,at){
  const cut=at-56*DAY,sets={};
  for(const s of sessList()){if(s.start>at||s.start<cut)continue;for(const en of s.entries){const e=EX[en.ex];if(!e||e.m!==m)continue;const d=en.sets.filter(x=>x.done).length;if(d)sets[en.ex]=(sets[en.ex]||0)+d}}
  const ok=Object.keys(sets).map(id=>({g:exGain(id,at),w:sets[id]})).filter(x=>!x.g.cal),w=ok.reduce((a,x)=>a+x.w,0);
  return w?ok.reduce((a,x)=>a+x.g.pct*x.w,0)/w:null;
}
function muscleStats(){
  const cut=Date.now()-56*DAY,sets={},last={};
  for(const s of sessList())for(const en of s.entries){const e=EX[en.ex];if(!e)continue;const d=en.sets.filter(x=>x.done).length;if(!d)continue;
    last[e.m]=Math.max(last[e.m]||0,s.start);if(s.start>=cut)sets[en.ex]=(sets[en.ex]||0)+d}
  const inRoutine={};Object.keys(DAYS).forEach(d=>(S.config.routine[d]||[]).forEach(it=>{if(EX[it.ex])inRoutine[it.ex]=1}));
  const out={};
  Object.keys(MUS).forEach(m=>{
    const ids=[...new Set(Object.keys(inRoutine).concat(Object.keys(sets)))].filter(id=>EX[id].m===m);
    const exs=ids.map(id=>({id,g:exGain(id),sets:sets[id]||0}));
    const ok=exs.filter(x=>!x.g.cal&&x.sets>0),w=ok.reduce((a,x)=>a+x.sets,0);
    const rk=ids.map(id=>rankOf(id)).filter(Boolean);
    out[m]={m,exs,pct:w?ok.reduce((a,x)=>a+x.g.pct*x.sets,0)/w:null,w,cal:!w&&exs.some(x=>x.g.n>0),last:last[m]||0,
      rank:rk.length?tierOf(rk.reduce((a,r)=>a+r.p,0)/rk.length):null};
  });
  return out;
}
const fmtPct=v=>(v>0.05?'+':v<-0.05?'−':'')+num(Math.abs(v))+' %';
function mmBalance(st,w4){
  const out=[];
  [['pecho','espalda'],['cuad','fem'],['hant','hpost']].forEach(([a,b])=>{
    const A=st[a],B=st[b],low=x=>MUS[x][0].toLowerCase();
    if(A.pct!=null&&B.pct!=null&&Math.abs(A.pct-B.pct)>=15){const lo=A.pct<B.pct?a:b,hi=lo===a?b:a;
      out.push({lo,h:MUS[hi][0]+' '+fmtPct(st[hi].pct)+', '+low(lo)+' '+fmtPct(st[lo].pct),p:'Tu fuerza avanza disparejo. Para emparejar, suma una serie a '+low(lo)+' durante unas semanas.'});return}
    const va=w4[a],vb=w4[b],mx=Math.max(va,vb),mn=Math.min(va,vb);
    if(mx>=12&&mn<mx/1.5){const lo=va<vb?a:b,hi=lo===a?b:a;
      out.push({lo,h:MUS[hi][0]+' '+num(mx)+' series, '+low(lo)+' '+num(mn),p:'Últimas 4 semanas. Un lado recibe mucho más trabajo; sube series de '+low(lo)+' para equilibrar.'})}
  });

}
const MMU=()=>U.mm||(U.mm={mode:'f',ang:0,sel:null});
const mmView=()=>{const a=((MMU().ang||0)%360+360)%360;return a>90&&a<270?'back':'front'};
const agoTxt=t=>{const d=daysSince(dstr(t));return d===0?'hoy':d===1?'ayer':'hace '+d+' días'};
function spark(vals){

  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia de 8 semanas: de ${fmtPct(vals[0])} a ${fmtPct(vals[vals.length-1])}"><line class="z" x1="${P}" x2="${W-P}" y1="${z}" y2="${z}"/><path class="a" d="${d} L${X(vals.length-1)} ${z} L${X(0)} ${z} Z"/><path class="l" d="${d}"/><circle cx="${X(vals.length-1)}" cy="${Y(vals[vals.length-1])}" r="4.5"/></svg>`;

/* ---------- mapa muscular: vista ---------- */
function vMuscleMap(){

  if(!u.sel){const best=ks.filter(m=>st[m].pct!=null).sort((a,b)=>st[b].pct-st[a].pct)[0];u.sel=best||'pecho'}
  const fillOf=k=>{
    if(MM_NR[k])return{c:'var(--mm-nr)',t:'sin ejercicio directo'};
    if(u.mode==='f'){const s=st[k];if(s.pct==null)return{c:'var(--mm-0)',t:s.cal?'calibrando':'0 %'};
      if(s.pct<=0)return{c:'var(--mm-0)',t:fmtPct(s.pct)};const p=Math.min(1,s.pct/40);return{c:`color-mix(in srgb, var(--gain) ${Math.round(18+82*p)}%, var(--mm-0))`,t:fmtPct(s.pct)}}

    const v=ws[k],[,lo,hi]=MUS[k];return{t:num(v)+(v===1?' serie':' series'),up:v>=lo&&v<=hi}};

    const withP=ks.filter(m=>st[m].pct!=null),w=withP.reduce((a,m)=>a+st[m].w,0),avg=w?withP.reduce((a,m)=>a+st[m].pct*st[m].w,0)/w:0;

  }

      <div><span class="eyebrow">Último</span><b>${s.last?agoTxt(s.last):'—'}</b></div></div>
    ${u.mode==='f'?`<div class="bar ${v>=lo?'in':''}" style="margin-top:6px"><span class="zone" style="left:${lo/max*100}%;width:${(hi-lo)/max*100}%"></span><i style="width:${Math.min(100,v/max*100)}%"></i></div>`:''}

/* girar arrastrando */
let MMD=null,MMNC=0;
function mmSetView(){const l=document.querySelector('[data-mmview]');if(l)l.textContent=mmView()==='back'?'Espalda':'Frente'}
document.addEventListener('pointerdown',e=>{const st=e.target.closest&&e.target.closest('.mmstage');if(!st)return;MMD={x:e.clientX,y:e.clientY,base:MMU().ang||0,f:st.querySelector('.mmflip'),drag:false}});

  if(!MMD.drag){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){MMD.drag=true;MMD.f.style.transition='none'}else if(Math.abs(dy)>10){MMD=null;return}else return}
  MMD.ang=MMD.base+dx*0.8;MMD.f.style.transform=`rotateY(${MMD.ang}deg)`;});

  const tgt=Math.round(d.ang/180)*180;MMU().ang=tgt;d.f.style.transition='';d.f.style.transform=`rotateY(${tgt}deg)`;mmSetView()}

/* ---------- la vez pasada: mismo ejercicio o, si no hay, el último del mismo músculo ---------- */
function lastOfMuscle(m,exclude){
  const L=sessList();
  for(let i=L.length-1;i>=0;i--){const s=L[i];for(const en of s.entries){const e=EX[en.ex];if(!e||e.m!==m||en.ex===exclude)continue;const sets=en.sets.filter(x=>x.done);if(sets.length)return{t:s.start,ex:en.ex,unit:en.unit,sets}}}
  return null;
}
const setsTxt=(sets,unit,ex)=>{const e=EX[ex]||{};const pure=(e.bw||e.bwx)&&sets.every(x=>!(x.kg>0));if(pure)return sets.map(x=>x.r).join(' · ')+' reps';
  const ws=[...new Set(sets.map(x=>num(roundTo(fromKg(x.kg,unit),0.25))))];
  return ws.length===1?ws[0]+' '+unit+(e.db?' c/u':'')+' × '+sets.map(x=>x.r).join(' · '):sets.map(x=>num(roundTo(fromKg(x.kg,unit),0.25))+'×'+x.r).join(' · ')+' '+unit};
/* comparación en vivo de una serie contra la misma serie de la vez pasada */
function setDelta(en,s,i,last){
  if(!last)return null;const ex=EX[en.ex]||{},ls=last.sets[i]||last.sets[last.sets.length-1];if(!ls)return null;
  const kg=toKg(s.w,en.unit);
  if((ex.bw||ex.bwx)&&kg===0&&!(ls.kg>0)){const d=s.r-ls.r;return{k:d>0?'up':d<0?'down':'eq',t:d>0?'↑ +'+d+' rep':d<0?'↓ '+d+' rep':''}}
  let d=kg-ls.kg;if(ex.as)d=-d;const v=num(Math.abs(fromKg(kg-ls.kg,en.unit)));
  if(d>0.01)return{k:'up',t:'↑ '+(ex.as?'−':'+')+v+' '+en.unit};
  if(d<-0.01)return{k:'down',t:'↓ '+(ex.as?'+':'−')+v+' '+en.unit};
  return{k:'eq',t:''};
}

/* agua: aparece al marcar la serie que lleva el sudor estimado sin reponer a ~200 mL */

  const need=Math.max(HYD.trig,H.snooze||0)-H.pend;return need<=0?0:Math.ceil(need/per);
}

/* 2. resumen: el cuerpo se enciende con lo que trabajaste */
function vWorked(s){
  const worked={};
  s.entries.forEach(en=>{const e=EX[en.ex];if(!e)return;const d=en.sets.filter(x=>x.done).length;if(!d)return;worked[e.m]=(worked[e.m]||0)+d;(SEC[en.ex]||[]).forEach(k=>{worked[k]=(worked[k]||0)+d/2})});
  const order=Object.keys(worked).sort((a,b)=>worked[b]-worked[a]);if(!order.length)return '';
  const mx=worked[order[0]],st=muscleStats();
  const fillOf=k=>{if(worked[k]){const i=order.indexOf(k);return{c:`color-mix(in srgb, var(--gain) ${Math.round(35+65*worked[k]/mx)}%, var(--mm-0))`,cls:'lit',d:(300+i*160)+'ms'}}
    return{c:MM_NR[k]?'var(--mm-nr)':'var(--mm-0)'}};
  return `<div class="sec worked"><div class="row between"><h3>Lo que trabajaste</h3><span class="small muted">${order.length} músculos</span></div>
  <div class="wfigs"><div>${mmSvg('front',fillOf,null)}<span class="small muted">Frente</span></div><div>${mmSvg('back',fillOf,null)}</div></div>
  <div class="wlist">${order.map((k,i)=>{const p=st[k]&&st[k].pct;return `<div class="wrow" style="--d:${300+i*160}ms"><span class="wdot"></span><b>${MUS[k][0]}</b><span class="small muted">${num(worked[k])} ${worked[k]===1?'serie':'series'}</span><b class="wpct ${p>0.05?'up':''}">${p!=null?fmtPct(p):st[k]&&st[k].cal?'base':'0 %'}</b></div>`}).join('')}</div>
  <p class="small muted" style="margin:8px 0 0">Más volt = más series hoy. El % es tu fuerza desde tu base.</p></div>`;
}

/* 5. resumen semanal tipo historias */
function recapWeek(){const ws=weekStart(Date.now()),wd=(new Date().getDay()+6)%7;return wd===0?ws-7*DAY:ws}
function weekRecap(ws){
  const we=ws+7*DAY,ss=sessList().filter(s=>s.start>=ws&&s.start<we),pv=sessList().filter(s=>s.start>=ws-7*DAY&&s.start<ws);
  const tot=L=>L.reduce((o,s)=>{const m=summaryOf(s);o.sets+=m.sets;o.vol+=m.vol;o.reps+=m.reps;return o},{sets:0,vol:0,reps:0});
  const T=tot(ss),P=tot(pv),prs=[],gains={};
  ss.forEach(s=>s.entries.forEach(en=>en.sets.forEach(x=>{if(x.pr&&!prs.includes(en.ex))prs.push(en.ex);if(x.g)gains[en.ex]=1})));
  let best=null;Object.keys(MUS).forEach(m=>{const a=musclePctAt(m,ws-1),b=musclePctAt(m,Math.min(we,Date.now()));if(b==null)return;const d=b-(a||0);if(!best||d>best.d)best={m,d,p:b}});
  const fx=ss.filter(s=>DAYS[s.day]&&DAYS[s.day].fx).length;
  return{ws,we,ss,T,P,prs,gains:Object.keys(gains).length,best,fx,st:streak()};
}

const GLYPH_N={pecho:'Pecho',espalda:'Espalda',hombro:'Hombro',brazo:'Brazos',pierna:'Pierna',gluteo:'Glúteo',abs:'Abdomen',torso:'Torso',completo:'Cuerpo completo'};
const M2G={pecho:'pecho',espalda:'espalda',hpost:'espalda',hlat:'hombro',hant:'hombro',biceps:'brazo',triceps:'brazo',cuad:'pierna',fem:'pierna',pant:'pierna',glut:'gluteo',abs:'abs'};
function dayGroup(items){
  const w={};let up=0,lo=0,tot=0;
  (items||[]).forEach(it=>{const e=EX[it.ex];if(!e)return;const g=M2G[e.m],s=it.s||3;w[g]=(w[g]||0)+s;tot+=s;if(['pierna','gluteo'].includes(g))lo+=s;else if(g!=='abs')up+=s});
  if(!tot)return 'completo';
  if(up/tot>=.28&&lo/tot>=.28)return 'completo';
  const top=Object.keys(w).sort((a,b)=>w[b]-w[a])[0];
  if(lo>up)return w.gluteo>=(w.pierna||0)?'gluteo':'pierna';
  return w[top]/tot<.42?'torso':top;
}
const glyphSvg=(g,cls)=>`<span class="dico dmask gm-${GLYPH[g]?g:'completo'} ${cls||''}" aria-hidden="true"></span>`;
(function(){const st=document.createElement('style');st.textContent=Object.keys(GLYPH).map(k=>`.gm-${k}{-webkit-mask-image:url(${GLYPH[k]});mask-image:url(${GLYPH[k]})}`).join('');(document.head||document.documentElement).appendChild(st)})();
let DG={},DIKEY='';
function ensureDayIcons(){
  const key=JSON.stringify(Object.keys(DAYS).map(d=>[d,(S.config.routine[d]||[]).map(it=>it.ex+':'+it.s)]));
  if(key===DIKEY)return;DIKEY=key;DG={};Object.keys(DAYS).forEach(d=>{DG[d]=dayGroup(S.config.routine[d])});
}
const dayIcon=(d,cls)=>glyphSvg(DG[d]||'completo',cls);
const dayShort=d=>{const n=(DAYS[d]&&DAYS[d].n)||d;return n.split(/[,:]/)[0].replace(/^Cuerpo completo/,'Completo')};

/* ---------- ranked: liga semanal de hasta 5 cuentas ---------- */
const RK_MAX=5;
const LG={db:null,user:null,uid:null,owner:false,list:null,err:null,names:{},last:'',busy:false};
const canon=v=>v&&typeof v==='object'&&!Array.isArray(v)?'{'+Object.keys(v).filter(k=>v[k]!==undefined&&k!=='id'&&k!=='upd').sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v);
const wkKey=ws=>{const d=new Date(ws);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
/* mejora de la semana: por ejercicio, mejor marca de la semana contra la mejor marca anterior; solo cuentan subidas (tope 20 %), promedio ponderado por series */
function rankScore(ws){
  const we=ws+7*DAY,per={};let ns=0;
  for(const s of sessList()){if(s.start<ws||s.start>=we)continue;ns++;for(const en of s.entries||[]){const d=(en.sets||[]).filter(x=>x.done).length;if(d)per[en.ex]=(per[en.ex]||0)+d}}
  let acc=0,sw=0,ex=0,up=0;
  for(const id of Object.keys(per)){
    const rm=repsMode(id),h=history(id);
    const val=x=>rm?Math.max(0,...x.sets.filter(s=>!(s.kg>0)).map(s=>s.r)):x.best;
    const prev=h.filter(x=>x.t<ws),cur=h.filter(x=>x.t>=ws&&x.t<we);
    if(!prev.length||!cur.length)continue;
    const pb=Math.max(...prev.map(val)),cb=Math.max(...cur.map(val));if(!(pb>0))continue;
    const p=Math.min(20,Math.max(0,(cb/pb-1)*100));
    acc+=p*per[id];sw+=per[id];ex++;if(p>0)up++;
  }
  return{sc:sw?Math.round(acc/sw*10)/10:null,ex,up,ns};
}
function leagueDoc(){
  const me=(LG.list||[]).find(x=>x.id===LG.uid)||{};
  const ws=weekStart(Date.now()),wk={};
  [ws,ws-7*DAY].forEach(w=>{const r=rankScore(w);if(r.ns)wk[wkKey(w)]=r});
  const old=me.wk&&typeof me.wk==='object'?me.wk:{};
  Object.keys(old).sort().reverse().slice(0,6).forEach(k=>{if(!wk[k])wk[k]=old[k]});
  const g=bw()?globalRank():null;
  return{v:1,nick:String(me.nick||'').slice(0,24),joined:me.joined||Date.now(),rp:g?Math.round(g.p*10)/10:null,st:streak(),wk};
}
function pushLeague(){
  if(!LG.db||!LG.uid||!LG.list||!LG.list.some(x=>x.id===LG.uid))return;
  const d=leagueDoc(),j=canon(d);if(j===LG.last)return;LG.last=j;
  d.upd=Date.now();LG.db.doc('league/'+LG.uid).set(d).catch(()=>{LG.last=''});
}

const TROPHY='<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/>';

function vRanked(){
  const now=Date.now(),ws=weekStart(now),we=ws+7*DAY,left=Math.ceil((we-now)/DAY),wk=wkKey(ws),pk=wkKey(ws-7*DAY);
  let h=`<h1>Ranked.</h1><p class="eyebrow rkweek">Semana ${fmtD(ws)} – ${fmtD(we-DAY)} · ${left<=1?'termina hoy':'faltan '+left+' días'}</p>`;
  if(!LG.db){const off=navigator.onLine===false||(HAS_CLOUD&&NET.fail);return h+(off?`<div class="card"><h3>Sin conexión</h3><p class="small muted">El ranked se actualiza cuando vuelvas a tener internet. Tus entrenamientos se siguen guardando.</p></div>`:`<div class="card"><h3>El ranked necesita tu cuenta</h3><p class="small muted">Abre Temple desde claude.ai con tu sesión iniciada para competir con tus amigos.</p></div>`)}
  if(LG.list==null)return h+(LG.err?`<div class="card"><h3>No se pudo cargar el ranked</h3><p class="small muted">Revisa tu conexión y vuelve a abrir la app.</p></div>`:`<div class="card"><p class="small muted">Cargando la liga…</p></div>`);
  const list=LG.list.filter(x=>x&&x.id),me=list.find(x=>x.id===LG.uid);
  rkNames(list.map(x=>x.id));
  const sc=(x,k)=>{const w=x.wk&&x.wk[k];return w&&typeof w.sc==='number'?w:null};
  const rows=list.map(x=>({x,w:sc(x,wk)})).sort((a,b)=>(b.w?1:0)-(a.w?1:0)||((b.w&&b.w.sc)||0)-((a.w&&a.w.sc)||0)||((b.w&&b.w.ns)||0)-((a.w&&a.w.ns)||0));
  /* campeón de la semana pasada */
  const prev=list.map(x=>({x,w:sc(x,pk)})).filter(r=>r.w&&r.w.sc>0).sort((a,b)=>b.w.sc-a.w.sc||b.w.ns-a.w.ns);
  if(prev.length)h+=`<div class="rkchamp"><svg viewBox="0 0 24 24" aria-hidden="true">${TROPHY}</svg><div><div class="eyebrow">Campeón de la semana pasada</div><b>${esc(rkName(prev[0].x))}</b> <span class="rkgain">+${num(prev[0].w.sc)} %</span></div></div>`;
  if(rows.length){
    h+=`<div class="rklist" role="list">`;let pos=0;
    rows.forEach(({x,w})=>{
      if(w)pos++;const isMe=x.id===LG.uid,t=typeof x.rp==='number'&&isFinite(x.rp)?tierOf(x.rp):null,st=Math.max(0,Math.floor(+x.st||0));
      const raw=x.wk&&x.wk[wk],ns=raw&&+raw.ns||0,ses=n=>n+' '+(n===1?'sesión':'sesiones');
      const sub=(w?ses(w.ns):ns?'Calibrando · '+ses(ns):'Sin entrenar')+' · racha '+st+' sem';
      const chip=t?`<span class="rktier" style="--c:var(--${t.cls})">${esc(t.name)}</span>`:'';
      h+=`<div class="rkrow${isMe?' me':''}${w&&pos===1&&w.sc>0?' top':''}" role="listitem"><span class="rkpos">${w?pos:'–'}</span><span class="rkwho"><b>${esc(rkName(x))}${isMe?' <em>tú</em>':''}</b><span class="rksub">${chip}<span class="small muted">${sub}</span></span></span><span class="rkpts${w&&w.sc>0?' up':''}">${w?(w.sc>0?'+':'')+num(w.sc):'—'}<small>${w?'%':''}</small></span></div>`;
    });
    h+=`</div>`;
  }
  if(!me){
    const full=list.length>=RK_MAX,def=(S.config.profile&&S.config.profile.name)||LG.names[LG.uid]||'';
    h+=`<div class="card rkjoin"><h3>${full?'La liga está llena':'Únete al ranked'}</h3><p class="small muted">${full?`Ya hay ${RK_MAX} de ${RK_MAX} lugares ocupados.`:`Compite cada semana contra tus amigos por quién mejora más. Quedan ${RK_MAX-list.length} de ${RK_MAX} lugares.`}</p>
    ${full?'':`<label class="small muted" for="rkNick">Cómo te van a ver</label><input id="rkNick" class="rknick" maxlength="24" autocomplete="nickname" value="${esc(def)}"><button class="btn primary full" style="margin-top:12px" data-a="rkJoin" ${LG.busy?'disabled':''}>${LG.busy?'Uniéndote…':'Unirme'}</button>`}</div>`;
  }
  h+=`<div class="card"><h3>Cómo se gana ${q('ranked')}</h3><p class="small muted">Gana quien más mejora contra sí mismo esta semana. Se reinicia cada lunes.</p><p class="small muted" style="margin-bottom:0">Los demás ven tu nombre, tu mejora, tu rango y tu racha. Nunca tu peso, tus medidas ni tus cargas.</p></div>`;
  if(me||LG.owner){
    h+=`<div class="card"><h3>Miembros · ${list.length}/${RK_MAX}</h3>${list.map(x=>{const mine=x.id===LG.uid,can=mine||LG.owner,c=U.rkConfirm===x.id;return`<div class="row between rkmem"><span>${esc(rkName(x))}${mine?' <span class="muted small">(tú)</span>':''}</span>${can?`<button class="btn sm${c?' danger':''}" data-a="rkLeave" data-v="${esc(x.id)}">${c?'Confirmar':mine?'Salir':'Quitar'}</button>`:''}</div>`}).join('')||'<p class="small muted">Aún no hay nadie.</p>'}${LG.owner?`<p class="small muted" style="margin-bottom:0">Para invitar: comparte este artefacto por correo con permiso de Editor.</p>`:''}</div>`;
  }
  return h;
}
